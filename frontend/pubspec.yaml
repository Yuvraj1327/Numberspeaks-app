name: numberspeaks_app
description: "Numberspeaks — Bonus Calculation App (Flutter frontend for the FastAPI backend)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase Auth only (login/session). The FastAPI backend verifies the
  # session token on every request; all data goes through it.
  supabase_flutter: ^2.17.2

  # HTTP client for the FastAPI backend (multipart upload with progress,
  # typed exceptions, timeouts).
  dio: ^5.7.0
  # Used directly for MultipartFile content-type on PDF uploads. Already a
  # transitive dependency of dio; declared explicitly since we import it.
  http_parser: ^4.0.2

  # State management, kept deliberately simple (ChangeNotifier + Provider),
  # matching the rest of this project's "keep it simple" approach.
  provider: ^6.1.2

  # PDF file selection for the upload screen.
  file_picker: ^8.1.2

  # Opens WhatsApp (wa.me click-to-chat) for Manual Send.
  url_launcher: ^6.3.0

  # Number/date formatting for bonus amounts and timestamps.
  intl: ^0.19.0

  # No longer used by the app's own code (reports/history now come from the
  # backend). Kept because supabase_flutter stores its session with it and
  # removing it needs a pubspec.lock refresh on your side — safe to leave.
  shared_preferences: ^2.3.2

  # Reads a real .env file at startup, mirroring the backend's own
  # python-dotenv usage (see core/app_config.dart and .env.example).
  flutter_dotenv: ^5.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundled at build time so flutter_dotenv can read it at startup. Must
    # exist before `flutter run`/`flutter build` — see .env.example.
    - .env
    # App logo — used in the top navbar and the login screen (see
    # widgets/app_logo.dart). Falls back to a drawn icon if this file is
    # ever missing, so a bad build never crashes on a missing asset.
    - assets/images/numberspeaks_logo.png
